services:
  ai-db:
    image: postgres:17
    container_name: liveshop-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD}
      POSTGRES_DB: liveshop_ai
    volumes:
      - ai_db_data:/var/lib/postgresql/data
    networks:
      - liveshop_net

  ai-backend:
    build: ./backend
    container_name: liveshop-ai-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - ai-db
    networks:
      - liveshop_net

  ai-frontend:
    build:
      context: ./frontend
      args:
        VITE_AI_API_URL: https://liveshop.com.co/ai-api
        VITE_LIVESHOP_API_URL: https://liveshop.com.co/api
    container_name: liveshop-ai-frontend
    restart: unless-stopped
    networks:
      - liveshop_net

networks:
  liveshop_net:
    external: true

volumes:
  ai_db_data:
